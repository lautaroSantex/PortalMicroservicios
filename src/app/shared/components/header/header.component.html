<header class="navbar-custom shadow-lg sticky top-0 z-50">
  <div class="container-fluid px-6 py-4">
    <div class="flex items-center justify-between w-full">
      
      <!-- Left Section - Logo/Brand -->
      <div class="flex items-center space-x-4">
        <a class="flex items-center space-x-3 text-white hover:text-blue-200 transition-colors" href="#">
          <!-- Logo del Banco -->
          <img 
            src="/src/app/assets/imagenes/logo_sin_claim_horizontal_2-removebg-preview.png" 
            alt="Logo Banco" 
            class="h-10 w-auto"
            (error)="onImageError($event)">
          
          <!-- Fallback logo si no encuentra la imagen -->
          <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center text-white font-bold text-lg hidden">
            B
          </div>
          
          <span class="text-xl font-bold tracking-wide">{{ bankName || 'BANCO' }}</span>
        </a>
      </div>

      <!-- Center Section - Page Title (opcional) -->
      <div class="hidden lg:block text-center">
        <h1 class="text-lg font-semibold text-white opacity-90">{{ pageTitle }}</h1>
      </div>
      
      <!-- Right Section - User Info & Logout -->
      <div class="flex items-center text-white space-x-6">
        
        <!-- User Info -->
        <div class="hidden md:flex items-center space-x-4">
          <div class="flex items-center space-x-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
            </svg>
            <span class="text-sm">Usuario: <strong>{{ currentUser?.name || 'Usuario' }}</strong></span>
          </div>
          
          <div class="flex items-center space-x-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-6 3a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"></path>
            </svg>
            <span class="text-sm">Perfil: <strong>{{ currentUser?.role || 'Administrador' }}</strong></span>
          </div>
        </div>

        <!-- Mobile User Info -->
        <div class="md:hidden flex items-center space-x-2">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
          </svg>
          <span class="text-sm font-semibold">{{ getUserInitials() }}</span>
        </div>

        <!-- Logout Button -->
        <button 
          (click)="onLogout()"
          class="btn-logout flex items-center space-x-2 bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition-all duration-200 shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          <span class="text-sm font-medium hidden sm:inline">Logout</span>
        </button>
      </div>
    </div>

    <!-- Mobile Page Title -->
    <div class="lg:hidden mt-3 pt-3 border-t border-white border-opacity-20">
      <h1 class="text-lg font-semibold text-white text-center opacity-90">{{ pageTitle }}</h1>
    </div>
  </div>
</header>
